<!-- Rare Heist: Friend Edition markup for the FriendSDK sandbox. Inlined by ../../build-sdk.mjs.
     Element IDs match ../../src/ui.js. Standalone-only controls (wallet, Friend picker, street,
     Last Heist, workshop, studio, export) are intentionally absent; ui.js skips them when SDK is set. -->
<div id="rhSdk" class="rh-sdk">
<header class="rh-bar">
 <button id="home" class="rh-home" aria-label="Rare Heist menu: lessons and jobs"><canvas id="brandSprite" width="32" height="32" aria-hidden="true"></canvas><span class="rh-brand">RARE <span class="signal">HEIST</span><small> / FRIEND EDITION</small></span></button>
 <button id="back" class="rh-back" aria-label="Back to lessons and jobs">&lt; JOBS</button>
 <div class="rh-job"><span id="modeBadge" class="tag">SOLO</span> <strong id="jobName"></strong></div>
 <div class="rh-tools">
  <button id="forecast" class="rh-playtool active" aria-pressed="true" title="F: show next-turn danger">FORECAST</button><button id="inspect" class="rh-playtool" aria-pressed="false" title="I: inspect objects without spending turns">INSPECT</button><button id="pause" class="rh-playtool" title="P: pause">PAUSE</button>
  <button id="resumeLast" hidden>RESUME JOB</button>
  <button id="sound" aria-pressed="false">SOUND OFF</button><button id="motion" aria-pressed="false">MOTION ON</button><button id="help" aria-label="Help">?</button>
 </div>
</header>
<main id="screens">
<section id="catalogPage" class="page rh-lobby" hidden></section>
<section id="streetPage" hidden></section><section id="lastPage" hidden></section><section id="replaysPage" hidden></section><section id="studioPage" hidden></section>
<section id="playPage" class="playpage" hidden>
 <div id="sharedBanner" class="statusline" hidden></div>
 <div class="play-layout"><div class="board-column">
  <div class="gamehud"><div class="hudgroup hud-where"><span id="floorStatus">F4</span><span id="turnStatus">TURN 0</span><span id="parStatus">PAR 46</span></div><div class="hudgroup hud-bag"><span id="relicStatus">TROPHY: NOT YET</span><span id="inventory">NO CARDS</span><span id="lightState">LIGHTS ON</span></div><div class="hudgroup hud-state"><span id="clockStatus" class="clock"></span><span id="alertStatus" class="alert">UNSEEN</span></div></div>
  <div class="boardwrap" id="boardWrap"><canvas id="gameCanvas" width="960" height="640" tabindex="0" aria-label="Cutaway vault. Left/right move, up/down use ladders. Space wait, E vent, Q EMP, L light, I inspect, Z practice rewind, R retry. Tap a cell to walk there."></canvas><div id="pauseShade" class="shade" hidden><div class="pausecard"><h2>PAUSED</h2><p class="note">Security only moves when you do, so take your time.</p><button id="resume" class="primary">RESUME</button> <button class="pause-forecast" aria-pressed="true">FORECAST ON</button></div></div></div>
  <div class="coach" id="coach"><span id="coachStep">RADIO</span><p id="coachText"></p><button id="hint" hidden>WATCH SOLUTION</button></div>
  <section class="inspectpanel" id="inspectorPanel" hidden aria-label="Tactical inspection"><div class="inspecthead"><strong id="inspectTitle">TACTICAL SCAN</strong><button id="closeInspect">CLOSE (I)</button></div><p id="inspectBody"></p><div id="inspectCycle" class="cyclebeats"></div><p id="inspectRisk" class="inspectrisk"></p></section>
  <div class="actions" id="gameActions"><div class="dpad"><button class="move" data-action="W" aria-label="Move left"><i class="arrow w"></i></button><button class="move" data-action="N" aria-label="Climb up"><i class="arrow n"></i></button><button class="move" data-action="S" aria-label="Climb down"><i class="arrow s"></i></button><button class="move" data-action="E" aria-label="Move right"><i class="arrow e"></i></button></div><div class="acts"><button data-action="WAIT"><span class="key">SPACE</span>WAIT</button><button data-action="VENT" id="ventAction"><span class="key">E</span>VENT</button><button data-action="LIGHT" id="lightAction"><span class="key">L</span>LIGHT</button><button data-action="EMP" id="empAction"><span class="key">Q</span>EMP</button></div><div class="runs"><button id="undo"><span class="key">Z</span>UNDO</button><button id="retry"><span class="key">R</span>RETRY</button></div></div>
  <div id="replayBar" class="replaybar" hidden><button id="replayToggle">PLAY</button><input id="replayPosition" type="range" min="0" max="1" value="0" aria-label="Replay position"><span id="replayCount">0 / 0</span></div>
 </div><aside id="editor" hidden></aside></div>
</section>
</main>
<dialog id="modal" aria-labelledby="dialogTitle"><div class="dialoginner" id="dialogContent"></div></dialog><div id="toast" role="status" hidden></div><p id="liveAnnounce" class="sr-only" aria-live="polite"></p>
</div>
