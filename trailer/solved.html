<!doctype html><html><head><meta charset="utf-8"><title>Rare Heist: every level, solved</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas#c{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../src/pixel-font.js"></script><script src="../src/engine.js"></script><script src="../src/art.js"></script>
<script src="../src/cutaway-render.js"></script><script src="../src/cutaway-levels.js"></script><script src="../src/cutaway-rules.js"></script>
<script src="../src/playfeel.js"></script><script src="../src/solutions.js"></script>
<script>
// "Every level, solved": all 23 shipped plans beaten by the stored solutions (src/solutions.js, generated by
// scripts/gen-solutions.mjs, proven by tests/solutions.test.cjs). Every board frame is drawn by the game's own
// renderer (src/cutaway-render.js) from states produced move by move by the game's engine (src/engine.js),
// in the same 'ghost' mode the in-game WATCH SOLUTION replay uses. Only the title cards and the bars are drawn here.
// #rec=1          recorder mode: window.__frame(t) draws the frame at t seconds; window.__plan lists the segments
// #w=1920&h=1080  frame size
'use strict';
const q=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const C=document.getElementById('c'),c=C.getContext('2d');
const W=+q.w||1920,H=+q.h||1080;C.width=W;C.height=H;
const E=HeistEngine,R=CutawayRules,P=HeistPixels,SOL=HEIST_SOLUTIONS,LV=HEIST_CUTAWAY_LEVELS,{INK,PAPER,SIG}=P,{night:NIGHT,dusk:DUSK,haze:HAZE,mist:MIST,wall:WALL}=P.PAL;
const G=HeistPixel.glyphs;
const FR={skel:RF_ART.find(x=>x.tokenId==='3412'),hover:RF_ART.find(x=>x.tokenId==='7730')};
const ease=t=>t<=0?0:t>=1?1:1-Math.pow(1-t,3),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const URL_TEXT='RAREHEIST-BC89FAA0.SSLIP.IO';
c.imageSmoothingEnabled=false;

// ---------- type: the game's own 5x7 pixel font ----------
function txt(s,x,y,k,col,align='left',count=Infinity){s=String(s).toUpperCase();const w=s.length*6*k-k;if(align==='center')x-=w/2;else if(align==='right')x-=w;x=Math.round(x);y=Math.round(y);let i=0;c.fillStyle=col;
 for(const ch of s){if(i++>=count)break;const g=(G[ch]||G['?']||'').split('/');for(let r=0;r<g.length;r++)for(let j=0;j<g[r].length;j++)if(g[r][j]==='1')c.fillRect(x+j*k,y+r*k,k,k);x+=6*k;}return w;}
const tw=(s,k)=>String(s).length*6*k-k;
function flash(t,dur,col=PAPER,max=.85){if(t<0||t>dur)return;c.globalAlpha=max*(1-t/dur);c.fillStyle=col;c.fillRect(0,0,W,H);c.globalAlpha=1;}
function slam(t,draw,cx=W/2,cy=H/2){const s=1+.35*(1-ease(t/.16));c.save();c.translate(cx,cy);c.scale(s,s);c.translate(-cx,-cy);draw();c.restore();}
function plate(x,y,w,h,fill=INK,edge=null,e=4){if(edge){c.fillStyle=edge;c.fillRect(Math.round(x-e),Math.round(y-e),Math.round(w+2*e),Math.round(h+2*e));}c.fillStyle=fill;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}

// ---------- night backdrop for the opening and closing cards (same recipe as trailer/director.html) ----------
const U=Math.max(1,Math.round(W/480));
function skyCanvas(seed){const iw=Math.ceil(W/U),ih=Math.ceil(H/U),cv=document.createElement('canvas');cv.width=iw;cv.height=ih;const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
 const gy=ih-26;P.rect(g,0,0,iw,ih,NIGHT);for(const [f,lv] of [[.5,2],[.66,4],[.8,7],[.9,10]]){const yy=Math.floor(gy*f);P.dither(g,0,yy,iw,gy-yy,lv,DUSK);}
 for(let i=0;i<iw*gy/700;i++){const x=Math.floor(P.hash(i,1,seed)*iw),y=Math.floor(P.hash(i,2,seed)*gy*.6);P.rect(g,x,y,1,1,P.hash(i,3,seed)<.3?MIST:HAZE);}
 {const mx=Math.floor(iw*.86),my=Math.floor(gy*.16),r=9;for(let yy=-r;yy<=r;yy++){const half=Math.floor(Math.sqrt(r*r-yy*yy));P.rect(g,mx-half,my+yy,half*2+1,1,PAPER);const bite=Math.floor(Math.sqrt(Math.max(0,r*r-(yy+1)*(yy+1))));if(bite>0)P.rect(g,mx-half+8,my+yy,Math.max(0,half*2+1-8),1,WALL);}}
 for(const [depth,col] of [[.5,DUSK],[.8,NIGHT]]){let x=-4,i=0;while(x<iw){const bw=12+Math.floor(P.hash(i,7,seed+depth*99)*26),bh=Math.floor(gy*(depth>.6?.1:.2)+P.hash(i,8,seed+depth*99)*gy*(depth>.6?.14:.24)),top=gy-bh;P.rect(g,x,top,bw,bh,col);
   for(let yy=top+3;yy<gy-3;yy+=4)for(let xx=x+2;xx<x+bw-2;xx+=3)if(P.hash(xx,yy,seed+depth*7)<(depth>.6?.12:.07))P.rect(g,xx,yy,1,1,depth>.6?HAZE:DUSK);x+=bw+(P.hash(i,10,seed)<.3?2:0);i++;}}
 P.rect(g,0,gy,iw,ih-gy,NIGHT);P.rect(g,0,gy,iw,1,HAZE);P.rect(g,0,gy+1,iw,2,DUSK);P.rect(g,0,gy+3,iw,1,INK);P.dither(g,0,gy+4,iw,ih-gy-4,2,DUSK);for(let x=seed%9;x<iw;x+=18)P.rect(g,x,gy+15,8,1,HAZE);
 cv.groundY=gy*U;return cv;}
function blitSky(cv){c.imageSmoothingEnabled=false;c.drawImage(cv,0,0,cv.width,cv.height,0,0,cv.width*U,cv.height*U);}

// ---------- the 23 plans in the game's own order ----------
// Lessons: HeistPlayfeel.LESSONS. Jobs: the street campaign (src/ui.js `campaign`), then the two annex jobs.
// Black Archive: archive-*. Last Heist: the opening vault, version 0 (last-cutaway = LastHeist.seed()).
const JOBS=['cut-02','cut-03','cut-05','cut-06','cut-07','cut-04','cut-01','cut-08','cut-09','cut-10','cut-11','cut-12','annex-01','annex-02'];
const GROUPS=[
 {key:'LESSON',ids:HeistPlayfeel.LESSONS.slice()},
 {key:'JOB',ids:JOBS},
 {key:'ARCHIVE',ids:LV.filter(l=>l.id.startsWith('archive-')).map(l=>l.id)},
 {key:'LAST HEIST',ids:['last-cutaway']}];
const ORDER=[];for(const g of GROUPS)g.ids.forEach((id,i)=>ORDER.push({id,group:g.key,n:i+1,of:g.ids.length}));
{const all=LV.map(l=>l.id).sort().join(),mine=ORDER.map(o=>o.id).sort().join(),sol=Object.keys(SOL).sort().join();
 if(all!==mine||all!==sol)throw new Error('plan list mismatch: levels '+all+' / video '+mine+' / solutions '+sol);}
const pad2=n=>String(n).padStart(2,'0');
const shortOf=o=>o.group==='LAST HEIST'?'LAST HEIST V0':o.group==='ARCHIVE'?'ARCHIVE '+pad2(o.n)+' / '+pad2(o.of):o.group+' '+pad2(o.n)+' / '+pad2(o.of),codeOf=o=>o.group==='LAST HEIST'?'V0':o.group[0]+pad2(o.n),labelOf=o=>o.group==='LAST HEIST'?'LAST HEIST / VAULT V0':o.group==='ARCHIVE'?'BLACK ARCHIVE '+pad2(o.n)+' / '+pad2(o.of):o.group+' '+pad2(o.n)+' / '+pad2(o.of);

// ---------- timing ----------
const CARD=1.35,HOLD=1.25,INTRO=4.2,OUTRO=8.5;
const stepOf=n=>clamp(3.9/n,.085,.16);
const TOP=92,BOT=76;
const levels=ORDER.map((o,idx)=>{
 const raw=LV.find(l=>l.id===o.id),l=R.normalize(raw),acts=SOL[o.id].actions,st=[E.create(l,'ghost')];
 for(const a of acts){const r=E.step(l,st.at(-1),a);if(!r.changed)throw new Error(o.id+': stored route breaks at turn '+st.length+' ('+a+')');st.push(r.state);}
 const end=st.at(-1),check=E.replay(l,acts,'ghost');
 if(end.status!=='won'||!check.ok||end.alarms!==0||end.empUsed!==0||acts.length!==SOL[o.id].turns)throw new Error(o.id+': stored route does not end in a clean win');
 const step=stepOf(acts.length),play=acts.length*step;
 return {...o,idx,raw,l,st,acts,turns:acts.length,par:raw.par,name:(raw.nameEn||raw.name),tag:raw.tag,step,play,dur:CARD+play+HOLD,detections:end.alarms,emp:end.empUsed,
  sample:idx%2?FR.hover:FR.skel};});
const SEG=[{kind:'intro',dur:INTRO},...levels.map(v=>({kind:'level',v,dur:v.dur})),{kind:'outro',dur:OUTRO}];
let acc=0;for(const s of SEG){s.start=acc;acc+=s.dur;}
const TOTAL=acc;

// ---------- a level: engine states + the real renderer ----------
function footC(g,y){return y%2?g.top[y]+g.hh[y]-g.pixel:g.top[y]+g.hh[y]/2+5*g.scale;}
function prep(v){if(v.cv)return;v.cv=document.createElement('canvas');v.r=HeistCutawayRenderer.create(v.cv);v.T=[-1e9];for(let i=1;i<v.st.length;i++)v.T[i]=CARD+(i-1)*v.step;v.last=0;}
// the board at time tt (seconds into the level); same call shape as the in-game replay (trace = states so far)
function board(v,tt,bw,bh){prep(v);let i=0;while(i+1<v.st.length&&v.T[i+1]<=tt)i++;const s=v.st[i],p=v.st[Math.max(0,i-1)];
 if(i>v.last){for(let j=v.last+1;j<=i;j++)v.r.pulse(v.st[j].events,v.T[j]*1000);v.last=i;}
 const next=v.T[i+1]??v.T[i]+.4,dur=Math.max(70,Math.min(190,(next-v.T[i])*1000*.92)),start=v.T[i]*1000;
 const anim=i>0?{from:{x:p.x,y:p.y},start,end:start+dur}:null;
 v.r.render(v.l,s,{sample:v.sample,time:tt*1000,width:bw,height:bh,anim,forecast:true,trace:v.st.slice(0,i+1),reach:false});
 return {i,s};}

// ---------- bars ----------
function progress(doneUpTo,active,t){ // bottom bar: 23 cells grouped by section
 c.fillStyle=INK;c.fillRect(0,H-BOT,W,BOT);c.fillStyle=DUSK;c.fillRect(0,H-BOT,W,2);
 const cw=44,ch=22,gap=8,ggap=34,y=H-BOT+27;let x=48;
 levels.forEach((v,k)=>{if(k&&v.group!==levels[k-1].group)x+=ggap-gap;const done=k<doneUpTo,on=k===active;
  if(on){c.fillStyle=PAPER;c.fillRect(x-3,y-3,cw+6,ch+6);}
  c.fillStyle=done?SIG:on?NIGHT:DUSK;c.fillRect(x,y,cw,ch);x+=cw+gap;});
 const n=Math.min(doneUpTo,levels.length);txt(n+' / '+levels.length+' SOLVED',W-48,y+1,3,n===levels.length?SIG:PAPER,'right');}
function topBar(v,s){c.fillStyle=INK;c.fillRect(0,0,W,TOP);c.fillStyle=DUSK;c.fillRect(0,TOP-2,W,2);
 const w=txt(shortOf(v),48,34,4,SIG);txt(v.name,48+w+36,34,4,PAPER);
 const right='TURN '+s.turn+' / '+v.turns+'   DETECTIONS '+s.alarms+'   PAR '+v.par;txt(right,W-48,34,4,s.status==='won'?SIG:PAPER,'right');}

// ---------- scenes ----------
const skyA=skyCanvas(11),skyB=skyCanvas(31);
function intro(t){blitSky(skyA);const gy=skyA.groundY;
 slam(t,()=>{const k=19;txt('EVERY LEVEL,',W/2,150,k,PAPER,'center');const w=tw('SOLVED.',k),by=150+9*k+10;plate(W/2-w/2-k,by-k,w+2*k,9*k,SIG,INK,8);txt('SOLVED.',W/2,by,k,INK,'center');});
 if(t>.45)txt('ALL 23 LEVELS OF RARE HEIST, BEATEN BY THE STORED SOLUTIONS',W/2,560,5,PAPER,'center',Math.floor((t-.45)*60));
 if(t>1.25)txt('5 LESSONS  /  14 JOBS  /  3 BLACK ARCHIVE  /  LAST HEIST VAULT V0',W/2,630,4,MIST,'center',Math.floor((t-1.25)*70));
 if(t>1.9)txt("REPLAYED MOVE BY MOVE BY THE GAME'S OWN ENGINE AND RENDERER",W/2,690,3,HAZE,'center',Math.floor((t-1.9)*80));
 txt('RARE HEIST',64,56,4,MIST);txt('RARE FRIENDS VIBEATHON 2026',W-64,56,4,MIST,'right');
 const x=(t*260)%(W+500)-250;P.sprite(c,FR.hover,x,gy,10,'right',true,Math.floor(t*9));P.sprite(c,FR.skel,x-260,gy,10,'right',true,Math.floor(t*9)+3);
 flash(t,.3);}
function level(v,tt){const bw=W,bh=H-TOP-BOT;const r=board(v,tt,bw,bh);
 c.fillStyle=NIGHT;c.fillRect(0,0,W,H);c.imageSmoothingEnabled=false;c.drawImage(v.cv,0,TOP);
 const won=r.s.status==='won'&&r.i===v.st.length-1,tWon=tt-(v.T[v.st.length-1]+.2);
 topBar(v,r.s);progress(v.idx+(won&&tWon>0?1:0),v.idx,tt);
 // title card over the dimmed opening position
 const cardOut=ease((tt-(CARD-.3))/.3);
 if(tt<CARD){c.globalAlpha=.62*(1-cardOut);c.fillStyle=NIGHT;c.fillRect(0,TOP,W,H-TOP-BOT);c.globalAlpha=1;
  const cy=TOP+(H-TOP-BOT)/2,ph=300,pw=Math.max(1100,tw(v.name,11)+160,tw(v.turns+' TURNS  /  '+v.detections+' DETECTIONS  /  PAR '+v.par,5)+200),dy=Math.round(-cardOut*40);c.globalAlpha=1-cardOut;
  plate(W/2-pw/2,cy-ph/2+dy,pw,ph,INK,SIG,6);
  txt(labelOf(v)+'   ('+(v.idx+1)+' OF '+levels.length+')',W/2,cy-ph/2+40+dy,4,SIG,'center');
  txt(v.name,W/2,cy-ph/2+100+dy,11,PAPER,'center',Math.floor(tt*50)+3);
  txt(v.turns+' TURNS  /  '+v.detections+' DETECTIONS  /  PAR '+v.par,W/2,cy-ph/2+200+dy,5,MIST,'center',Math.floor(Math.max(0,tt-.12)*110)+1);
  txt(v.tag,W/2,cy-ph/2+254+dy,3,HAZE,'center');
  c.globalAlpha=1;}
 // the clean exit
 if(won&&tWon>0){const cx=W/2,cy=Math.round(TOP+(H-TOP-BOT)*.5)-30;slam(tWon,()=>{const k=12,s='SOLVED',w=tw(s,k);plate(cx-w/2-40,cy-60,w+80,7*k+48,SIG,INK,8);txt(s,cx,cy-36,k,INK,'center');},cx,cy-18);
  if(tWon>.12){const s=v.turns+' TURNS  /  '+v.detections+' DETECTIONS  /  NO EMP  /  PAR '+v.par,w=tw(s,4);plate(cx-w/2-24,cy+72,w+48,4*7+28,INK,null);txt(s,cx,cy+86,4,PAPER,'center');}
  flash(tWon,.18,PAPER,.35);}
 if(tt<.14)flash(tt,.14,PAPER,.3);}
function outro(t){blitSky(skyB);const gy=skyB.groundY;
 slam(t,()=>{const k=16,s='23 / 23',w=tw(s,k);plate(W/2-w/2-k,70-k,w+2*k,9*k,SIG,INK,8);txt(s,W/2,70,k,INK,'center');});
 if(t>.3)txt('LEVELS SOLVED BY THE STORED SOLUTIONS',W/2,236,6,PAPER,'center',Math.floor((t-.3)*60));
 // the table: every plan with its turns, filled in row by row
 const cols=3,cw=560,gap=40,x0=W/2-(cols*cw+(cols-1)*gap)/2,y0=318,lh=34,per=Math.ceil(levels.length/cols);
 c.globalAlpha=.82;plate(x0-28,y0-20,cols*cw+(cols-1)*gap+56,per*lh+80,INK);c.globalAlpha=1;
 levels.forEach((v,k)=>{const col=Math.floor(k/per),row=k%per,x=x0+col*(cw+gap),y=y0+row*lh,show=t-.8-k*.05;if(show<0)return;
  txt('✓',x,y,3,SIG);txt(codeOf(v),x+30,y,3,HAZE);txt(v.name,x+120,y,3,PAPER);txt(String(v.turns),x+cw,y,3,MIST,'right');});
 if(t>2.2)txt('TURNS PER LEVEL  /  0 DETECTIONS  /  NO EMP  /  EVERY ROUTE CHECKED BY TESTS/SOLUTIONS.TEST.CJS',W/2,y0+per*lh+26,3,MIST,'center',Math.floor((t-2.2)*90));
 if(t>3.0){const s='WATCH ANY OF THEM IN-GAME:  WATCH SOLUTION',k=5,w=tw(s,k);plate(W/2-w/2-28,y0+per*lh+92,w+56,7*k+36,INK,SIG,5);txt(s,W/2,y0+per*lh+110,k,PAPER,'center',Math.floor((t-3)*60));}
 if(t>3.8){const w=tw(URL_TEXT,4);plate(W/2-w/2-20,y0+per*lh+176,w+40,4*7+24,INK);txt(URL_TEXT,W/2,y0+per*lh+188,4,SIG,'center',Math.floor((t-3.8)*50));}
 const x=(t*240)%(W+500)-250;P.sprite(c,FR.hover,x,gy,8,'right',true,Math.floor(t*9));P.sprite(c,FR.skel,x-200,gy,8,'right',true,Math.floor(t*9)+3);
 flash(t,.3);if(t>OUTRO-.8){c.globalAlpha=clamp((t-(OUTRO-.8))/.8,0,1);c.fillStyle='#000';c.fillRect(0,0,W,H);c.globalAlpha=1;}}

window.__plan={total:TOTAL,segments:SEG.map((s,i)=>({i,kind:s.kind,start:s.start,dur:s.dur,id:s.v?.id,name:s.v?.name,label:s.v?labelOf(s.v):null,turns:s.v?.turns,par:s.v?.par,detections:s.v?.detections,emp:s.v?.emp,step:s.v?.step}))};
// __frame(t, seg): draws global time t. Segments are self-contained: a recorder may start at any segment's first frame.
window.__frame=t=>{let k=SEG.length-1;while(k>0&&SEG[k].start>t)k--;const s=SEG[k],tt=t-s.start;
 c.save();c.setTransform(1,0,0,1,0,0);c.imageSmoothingEnabled=false;
 if(s.kind==='intro')intro(tt);else if(s.kind==='outro')outro(tt);else level(s.v,tt);c.restore();};
window.__ready=true;
if(!q.rec){const T0=performance.now();const loop=()=>{window.__frame(((performance.now()-T0)/1000)%TOTAL);requestAnimationFrame(loop);};loop();}
</script></body></html>
