<!doctype html><html><head><meta charset="utf-8"><title>Rare Heist trailer v2 director</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas#c{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../src/pixel-font.js"></script><script src="../src/engine.js"></script><script src="../src/art.js"></script>
<script src="../src/cutaway-rules.js"></script><script src="../src/cutaway-levels.js"></script><script src="../src/solutions.js"></script>
<script src="../src/playfeel.js"></script><script src="../src/cutaway-render.js"></script><script src="../src/last-heist.js"></script>
<script src="cut-data.js"></script><script src="cut-timeline.js"></script>
<script>
// Rare Heist trailer v2. Every board, guard, beam, curtain, nameplate, caught freeze, escape and editor verdict is drawn
// by the game's own engine (src/engine.js) and renderer (src/cutaway-render.js) from stored solutions (src/solutions.js)
// or from trailer/cut-data.cjs (a real one-step mistake, real solver verdicts, a real Last Heist evolution). The stake
// and shop panels are captures of the real interface (trailer/ui-shots.mjs). Titles, transitions and particles are
// the trailer's own motion design, on the same 4 px grid as the game.
//   #t=<seconds>        live preview from that time           #rec=1   recorder mode: window.__frame(t) draws frame t
'use strict';
const q=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const C=document.getElementById('c'),c=C.getContext('2d',{alpha:false});const W=1920,H=1080;C.width=W;C.height=H;
const E=HeistEngine,P=HeistPixels,SOL=HEIST_SOLUTIONS,LV=HEIST_CUTAWAY_LEVELS,D=window.CUTDATA,CUT=window.CUT,A=LastHeist;
const {INK,PAPER,SIG}=P,{night:NIGHT,dusk:DUSK,haze:HAZE,mist:MIST,wall:WALL}=P.PAL;
const G=HeistPixel.glyphs,BEAT=60/CUT.bpm,BAR=4*BEAT,FPS=CUT.fps;
const HERO=RF_ART.find(x=>x.tokenId===D.hero),OTHER=RF_ART.find(x=>x.tokenId!==D.hero);
const hash=(a,b,s)=>P.hash(a,b,s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,sat=t=>clamp(t,0,1);
const eo=t=>{t=sat(t);return 1-Math.pow(1-t,3);},eio=t=>{t=sat(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;},expo=t=>{t=sat(t);return t>=1?1:1-Math.pow(2,-10*t);};
const back=t=>{t=sat(t);const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);};
const snap=(v,g=4)=>Math.round(v/g)*g;
const zl=(a,b,u)=>a*Math.pow(b/a,sat(u));
function layerCanvas(){const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d',{alpha:false});g.imageSmoothingEnabled=false;return {cv,g};}
const LA=layerCanvas(),LB=layerCanvas(),TMP=document.createElement('canvas');TMP.width=W;TMP.height=H;const tg=TMP.getContext('2d');tg.imageSmoothingEnabled=false;
const TXT=document.createElement('canvas');TXT.width=W;TXT.height=H;const xg=TXT.getContext('2d');xg.imageSmoothingEnabled=false;
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

// ================= type: the game's 5x7 pixel font =================
const tw=(s,k)=>String(s).length*6*k-k;
function glyph(ch){return (G[ch]||G['?']||'').split('/');}
function txt(g,s,x,y,k,col,align='left',count=Infinity){s=String(s);const w=tw(s,k);if(align==='center')x-=w/2;else if(align==='right')x-=w;x=Math.round(x);y=Math.round(y);g.fillStyle=col;let i=0;
 for(const ch of s){if(i++>=count)break;const gl=glyph(ch);for(let r=0;r<gl.length;r++)for(let j=0;j<gl[r].length;j++)if(gl[r][j]==='1')g.fillRect(x+j*k,y+r*k,k,k);x+=6*k;}return w;}
// text with a hard ink drop shadow (the game's UI buttons use the same offset block)
function stxt(g,s,x,y,k,col,align='left',count=Infinity,sh=null){sh=sh??Math.max(4,snap(k/3));txt(g,s,x+sh,y+sh,k,INK,align,count);return txt(g,s,x,y,k,col,align,count);}
// per-letter drop: each letter falls from above and lands with a small overshoot
function dropTxt(g,s,x,y,k,col,t,{stagger=.06,dur=.28,from=-160,align='left',shadow=true}={}){s=String(s);const w=tw(s,k);if(align==='center')x-=w/2;else if(align==='right')x-=w;
 [...s].forEach((ch,i)=>{const u=(t-i*stagger)/dur;if(u<=0||ch===' ')return;const dy=snap(from*(1-back(u)));if(shadow)txt(g,ch,x+i*6*k+Math.max(4,snap(k/3)),y+dy+Math.max(4,snap(k/3)),k,INK);txt(g,ch,x+i*6*k,y+dy,k,col);});return w;}
// slam: integer pixel size shrinking onto the target size (crisp at every frame)
function slamK(k,t,over=1.7,dur=.14){return t<0?0:Math.max(k,Math.round(k*lerp(over,1,eo(t/dur))));}
// dither build: glyph pixels appear in Bayer order
function ditherTxt(g,s,x,y,k,col,p,align='left'){s=String(s);const w=tw(s,k);if(align==='center')x-=w/2;else if(align==='right')x-=w;x=Math.round(x);y=Math.round(y);g.fillStyle=col;let cx=x;
 for(const ch of s){const gl=glyph(ch);for(let r=0;r<gl.length;r++)for(let j=0;j<gl[r].length;j++)if(gl[r][j]==='1'&&(BAY[((j+Math.floor(cx/k))&3)+((r&3)<<2)]+.5)/16<p)g.fillRect(cx+j*k,y+r*k,k,k);cx+=6*k;}return w;}
function typeTxt(g,s,x,y,k,col,t,cps=40,{align='left',cursor=true,shadow=false}={}){if(t<0)return;s=String(s);const n=Math.floor(t*cps)+1,w=tw(s,k);let bx=align==='center'?x-w/2:align==='right'?x-w:x;bx=snap(bx,k);
 (shadow?stxt:txt)(g,s,bx,y,k,col,'left',n);if(cursor&&n<s.length){g.fillStyle=col;g.fillRect(bx+n*6*k,y,5*k,7*k);}}
function plate(g,x,y,w,h,fill,edge=INK,b=4){g.fillStyle=edge;g.fillRect(Math.round(x-b),Math.round(y-b),Math.round(w+2*b),Math.round(h+2*b));g.fillStyle=fill;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
// caption on an ink plate that opens first, then the words drop or slam in
function cap(g,s,x,y,k,col,t,mode='drop'){if(t<0)return;const w=tw(s,k),pw=snap((w+48)*eo(t/.12));g.fillStyle=INK;g.fillRect(x-24,y-20,pw,7*k+40);g.save();g.beginPath();g.rect(x-24,y-20,pw,7*k+40);g.clip();
 if(mode==='slam'){const kk=slamK(k,t-.06,1.5,.1);txt(g,s,x,y+7*(k-kk),kk,col);}else dropTxt(g,s,x,y,k,col,t-.04,{stagger:.035,dur:.2,from:-90,shadow:false});g.restore();}
const CAPY2=H-88-48-7*14,CAPY1=CAPY2-7*14-56;
// lime light sweep across a rectangle: redraws the text in SIG (or ink on lime) inside a moving slanted band
function sweep(g,drawIn,p,x,y,w,h,band=160){const bx=lerp(x-band-h,x+w+band,p);g.save();g.beginPath();for(let yy=0;yy<h;yy+=8){const off=(h-yy)*.5;g.rect(snap(bx+off),y+yy,band,8);}g.clip();drawIn();g.restore();}

// ================= dither + masks =================
const patCache=new Map();
function dpat(g,level,col,cell=4){const key=level+col+cell;let p=patCache.get(key);if(!p){const t=document.createElement('canvas');t.width=t.height=4*cell;const x=t.getContext('2d');x.fillStyle=col;for(let i=0;i<16;i++)if(BAY[i]<level)x.fillRect((i&3)*cell,(i>>2)*cell,cell,cell);p=x;patCache.set(key,t);}return g.createPattern(patCache.get(key),'repeat');}
function dfill(g,x,y,w,h,level,col,cell=4){if(level<=0||w<=0||h<=0)return;g.fillStyle=level>=16?col:dpat(g,level,col,cell);g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
// Mask transition: show layer B on cells where test(cellX,cellY) is true. cell in px.
function maskBlit(dst,src,cell,test){const nx=Math.ceil(W/cell),ny=Math.ceil(H/cell);for(let y=0;y<ny;y++){let run=-1;for(let x=0;x<=nx;x++){const on=x<nx&&test(x,y,nx,ny);if(on&&run<0)run=x;if(!on&&run>=0){dst.drawImage(src,run*cell,y*cell,(x-run)*cell,cell,run*cell,y*cell,(x-run)*cell,cell);run=-1;}}}}
function scan(g,t,alpha=.16){g.globalAlpha=alpha;g.fillStyle=INK;for(let y=0;y<H;y+=8)g.fillRect(0,y,W,4);g.globalAlpha=1;}
function flash(g,t,dur=.12,col=PAPER,max=.9){if(t<0||t>dur)return;const lv=Math.round(16*max*(1-t/dur));dfill(g,0,0,W,H,lv,col,8);}
function shakeOf(t,dur,amp){if(t<0||t>dur)return [0,0];const k=(1-t/dur)*amp;return [snap(Math.sin(t*93)*k),snap(Math.cos(t*71)*k*.6)];}
function bars(g,h){if(h<=0)return;g.fillStyle=INK;g.fillRect(0,0,W,h);g.fillRect(0,H-h,W,h);}
// deterministic particles: embers/sparks as squares on the 4px grid
function embers(g,t,{x0,x1,y0,n=60,seed=1,life=1.6,rise=260,spread=40,size=[4,8],cols=[PAPER,SIG,SIG,HAZE],from=-1e9,period=1.6}){for(let i=0;i<n;i++){const birth=hash(i,1,seed)*period,cyc=Math.floor((t-birth)/life),age=t-birth-cyc*life,start=birth+cyc*life;if(start<from||age<0)continue;const u=age/life;
  const x=x0+hash(i,2+cyc,seed)*(x1-x0)+Math.sin(age*3+i)*spread*u,y=y0-rise*age-(hash(i,4,seed)*60),s=u<.5?size[1]:size[0];g.fillStyle=cols[Math.min(cols.length-1,Math.floor(u*cols.length))];g.fillRect(snap(x),snap(y),s,s);}}
function sparks(g,t,cx,cy,{n=40,seed=3,speed=900,grav=1400,life=1}={}){if(t<0||t>life)return;for(let i=0;i<n;i++){const a=hash(i,1,seed)*Math.PI*2,sp=speed*(.35+.65*hash(i,2,seed)),x=cx+Math.cos(a)*sp*t,y=cy+Math.sin(a)*sp*t+grav*t*t*.5,big=i%4===0;
  if(big&&t<life*.6){g.fillStyle=INK;g.fillRect(snap(x)-8,snap(y)-4,20,12);g.fillRect(snap(x)-4,snap(y)-8,12,20);g.fillStyle=PAPER;g.fillRect(snap(x)-4,snap(y),12,4);g.fillRect(snap(x),snap(y)-4,4,12);}
  else{g.fillStyle=INK;g.fillRect(snap(x)-4,snap(y)-4,12,12);g.fillStyle=i%3?SIG:PAPER;g.fillRect(snap(x),snap(y),4,4);}}}

// ================= parallax night (title cards), on a 4 px art grid =================
const U=4,IW=W/U,IH=H/U;
function skyLayers(seed){const mk=(w,h)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');g.imageSmoothingEnabled=false;return [cv,g];};
 const gy=IH-34,[sky,a]=mk(IW,IH);P.rect(a,0,0,IW,IH,NIGHT);for(const [f,lv] of [[.45,2],[.62,4],[.78,7],[.9,10]]){const yy=Math.floor(gy*f);P.dither(a,0,yy,IW,gy-yy,lv,DUSK);}
 const [stars,b]=mk(IW*2,IH);for(let i=0;i<IW*2*gy/650;i++){const x=Math.floor(hash(i,1,seed)*IW*2),y=Math.floor(hash(i,2,seed)*gy*.62);P.rect(b,x,y,1,1,hash(i,3,seed)<.3?MIST:HAZE);}
 const skyline=(depth,col,win)=>{const [cv,g]=mk(IW*2,IH);let x=0,i=0;while(x<IW*2){const bw=12+Math.floor(hash(i,7,seed+depth*99)*26),bh=Math.floor(gy*(depth>.6?.12:.22)+hash(i,8,seed+depth*99)*gy*(depth>.6?.16:.26)),top=gy-bh;P.rect(g,x,top,bw,bh,col);
   for(let yy=top+3;yy<gy-3;yy+=4)for(let xx=x+2;xx<x+bw-2;xx+=3)if(hash(xx,yy,seed+depth*7)<win)P.rect(g,xx,yy,1,1,depth>.6?HAZE:DUSK);if(hash(i,11,seed)<.2){P.rect(g,x+Math.floor(bw/2),top-6,1,6,col);}x+=bw+(hash(i,10,seed)<.3?3:0);i++;}return cv;};
 const far=skyline(.5,DUSK,.07),near=skyline(.8,NIGHT,.12);
 const [ground,d]=mk(IW*2,IH);P.rect(d,0,gy,IW*2,IH-gy,NIGHT);P.rect(d,0,gy,IW*2,1,HAZE);P.rect(d,0,gy+1,IW*2,2,DUSK);P.rect(d,0,gy+3,IW*2,1,INK);P.dither(d,0,gy+4,IW*2,IH-gy-4,2,DUSK);for(let x=0;x<IW*2;x+=18)P.rect(d,x,gy+17,8,1,HAZE);
 for(let x=24;x<IW*2;x+=96){P.rect(d,x,gy-40,1,40,HAZE);P.rect(d,x-2,gy-41,5,2,MIST);P.dither(d,x-10,gy-38,21,38,1,MIST);}
 return {sky,stars,far,near,ground,gy:gy*U};}
function drawSky(g,L,t,speed=1,moon=true){g.imageSmoothingEnabled=false;g.drawImage(L.sky,0,0,IW,IH,0,0,W,H);
 const lay=(cv,v)=>{const off=((Math.floor(t*v*speed))%IW+IW)%IW;g.drawImage(cv,off,0,IW,IH,0,0,W,H);};
 lay(L.stars,1);if(moon){const mx=W*.82,my=H*.2,r=40;for(let yy=-r;yy<=r;yy+=4){const half=snap(Math.sqrt(r*r-yy*yy));g.fillStyle=PAPER;g.fillRect(mx-half,my+yy,half*2,4);}g.fillStyle=NIGHT;for(let yy=-r;yy<=r;yy+=4){const half=snap(Math.sqrt(r*r-yy*yy));g.fillRect(mx-half+28,my+yy-8,Math.max(0,half*2-20),4);}}
 lay(L.far,4);lay(L.near,10);lay(L.ground,24);}

// ================= game views: engine states + the real renderer =================
function statesOf(id,actions,mode='operative',lvl){const l=E.normalize(lvl||LV.find(x=>x.id===id));const st=[E.create(l,mode)];for(const a of actions){const r=E.step(l,st.at(-1),a);if(!r.changed)throw new Error('bad '+id+' '+a+' at '+st.length);st.push(r.state);}return st;}
function view(level,st,{sample=HERO,w=W,h=H}={}){const l=E.normalize(level),cv=document.createElement('canvas');cv.width=w;cv.height=h;return {l,st,cv,r:HeistCutawayRenderer.create(cv),T:[],last:-1,w,h,sample,cam:null,lastT:null};}
// T[i]: time the move into state i starts; states before the first scheduled one are already done
function schedule(v,segs){const first=Math.min(...segs.map(x=>x[0]));for(let i=0;i<first;i++)v.T[i]=-1000+i;for(const [a,b,t0,step] of segs)for(let i=a;i<=b;i++)v.T[i]=t0+(i-a)*step;for(let i=1;i<v.st.length;i++)if(v.T[i]==null)v.T[i]=1e9;v.T[0]=-2000;return v;}
function footOf(g,y){return y%2?g.top[y]+g.hh[y]-g.pixel:g.top[y]+g.hh[y]/2+5*g.scale;}
function drawView(v,t,o={}){let i=0;while(i+1<v.st.length&&v.T[i+1]<=t)i++;const s=v.st[i],p=v.st[Math.max(0,i-1)];
 if(i!==v.last){if(i>v.last)for(let j=Math.max(1,v.last+1);j<=i;j++)if(j>(v.quiet??0))v.r.pulse(v.st[j].events,v.T[j]*1000);v.last=i;}
 const next=v.T[i+1]??v.T[i]+.4,dur=Math.max(80,Math.min(o.tween??190,(next-v.T[i])*1000*.92)),start=v.T[i]*1000;
 const anim=i>0&&v.T[i]>-500?{from:{x:p.x,y:p.y},start,end:start+dur}:null;
 v.r.render(v.l,s,{sample:v.sample,time:t*1000,width:v.w,height:v.h,anim,forecast:false,...o.extra});
 const g=v.r.metrics(),u=anim?eo((t*1000-start)/dur):1,hx=g.x0+(lerp(p.x,s.x,u)+.5)*g.cw,hy=lerp(footOf(g,p.y),footOf(g,s.y),u)-8*g.scale;
 const gd=E.threats(v.l,s).guards.map(q=>({x:g.x0+(q.x+.5)*g.cw,y:footOf(g,q.y)-8*g.scale}));return {i,s,hx,hy,g,guards:gd};}
function camRect(v,cx,cy,z){const sw=W/z,sh=H/z;let sx=clamp(cx-sw/2,0,Math.max(0,v.w-sw)),sy=clamp(cy-sh/2,0,Math.max(0,v.h-sh));sx=Math.round(sx*z)/z;sy=Math.round(sy*z)/z;return {sx,sy,z,sw,sh};}
function shoot(g,v,cx,cy,z,ox=0,oy=0){const r=camRect(v,cx,cy,z);g.imageSmoothingEnabled=false;g.fillStyle=NIGHT;g.fillRect(0,0,W,H);g.drawImage(v.cv,r.sx,r.sy,r.sw,r.sh,ox,oy,W,H);return r;}
function follow(v,t,tx,ty,tau=.18){const dt=v.lastT==null?1:clamp(t-v.lastT,0,.2);v.lastT=t;if(!v.cam)v.cam={x:tx,y:ty};else{const k=1-Math.exp(-dt/tau);v.cam.x+=(tx-v.cam.x)*k;v.cam.y+=(ty-v.cam.y)*k;}return v.cam;}
const lvl=id=>LV.find(x=>x.id===id);

// ================= shots =================
const S={};
// ---------- COLD OPEN: a flashlight in the dark reads the line, then finds the Friend ----------
S.cold={init(){},draw(g,t){g.fillStyle=INK;g.fillRect(0,0,W,H);
  xg.clearRect(0,0,W,H);
  if(t<4.6){stxt(xg,'THIS IS NOT',W/2,330,20,PAPER,'center');stxt(xg,'A THIEF.',W/2,330+20*10,20,PAPER,'center');}
  // the beam: apex walks along the floor (a guard's flashlight), cone opens toward the facing side
  let ax,dir,len=t<4.6?2600:1500,spread=t<4.6?.28:.3,on=1;
  if(t<4.6){const u=eo((t-.6)/2.6);ax=lerp(-2600,-470,u)+(t>3.2?(t-3.2)*50:0);dir=1;}else{const u=eo((t-4.8)/1.4);ax=lerp(W+1500,W*.5+1100,u);dir=-1;}
  const ay=t<4.6?500:H*.62,flick=(t>.6&&t<.75&&Math.floor(t*40)%2)||(t>4.6&&t<4.85);if(flick)on=0;
  if(t<.6)on=0;
  if(on){const rows=[];for(let y=0;y<H;y+=8){const dy=Math.abs(y+4-ay),half=len*Math.tan(spread),dist=dy/Math.tan(spread);if(dy>half)continue;const x0=dir>0?ax+dist:ax-len,x1=dir>0?ax+len:ax-dist;if(x1<=x0)continue;rows.push([snap(x0,8),y,snap(x1-x0,8)]);}
   // lime dither of the beam itself (the game's vision colour), denser near the lamp
   for(const [x,y,w] of rows){const segs=6;for(let s=0;s<segs;s++){const sx=x+w*s/segs,d=dir>0?(sx-ax)/len:(ax-sx)/len,lv=Math.max(1,Math.round(6-5*d));dfill(g,sx,y,w/segs,8,lv,SIG,4);}}
   for(const [x,y,w] of rows)g.drawImage(TXT,x,y,w,8,x,y,w,8);
   // dust in the beam
   for(let i=0;i<70;i++){const px=snap(ax+dir*(hash(i,1,5)*len)),py=snap(ay+(hash(i,2,5)-.5)*len*.5+Math.sin(t*1.3+i)*20);if(rows.some(([x,y,w])=>py>=y&&py<y+8&&px>=x&&px<x+w)){g.fillStyle=hash(i,3,5)<.4?PAPER:SIG;g.fillRect(px,py,4,4);}}}
  // the Friend, small, where the beam stops
  if(t>=4.6){const fx=W/2,foot=H*.62+72;P.sprite(g,HERO,fx,foot,8,'down',false,t>6.4?Math.floor((t-6.4)*1000/300):0,on&&t>5.6);}
 }};
// ---------- REVEAL: THIS IS YOURS ----------
S.reveal={init(){this.mask=P.mask(HERO,'down',false,0);},draw(g,TT){const t=TT-8;const k=40,cx=snap(W*.3),foot=snap(H*.5+8*k-8),L=cx-8*k,T=foot-15*k;
  g.fillStyle=NIGHT;g.fillRect(0,0,W,H);
  // spotlight from above + floor pool
  for(let y=0;y<foot+40;y+=8){const half=lerp(60,9*k,y/foot);dfill(g,cx-half,y,half*2,8,y<foot-40?3:5,DUSK,4);}
  for(let y=0;y<foot;y+=8){const half=lerp(24,6*k,y/foot);dfill(g,cx-half,y,half*2,8,2,HAZE,4);}
  for(let y=foot-8;y<foot+64;y+=8){const half=lerp(10*k,6*k,(y-foot)/64);dfill(g,cx-half,y,half*2,8,y<foot+24?6:3,HAZE,4);}
  // pixel rain: every pixel of the original frame falls into place, bottom rows first
  // pixel by pixel: each original pixel pops in lime, then settles to ink; the paper halo lands last
  if(t>=.62){P.sprite(g,HERO,cx,foot,k,'down',false,t>2.6?Math.floor((t-2.6)*1000/300):0);flash(g,t-.62,.1,PAPER,.5);}
  else for(const [x,y] of this.mask){const t0=.04+(BAY[(x&3)+((y&3)<<2)]/16)*.3+hash(x,y,9)*.16,a=t-t0;if(a<0)continue;const pop=a<.07;g.fillStyle=pop?SIG:PAPER;const e=pop?8:0;if(!pop){g.fillStyle=INK;}g.fillRect(L+x*k-e,T+y*k-e,k+2*e,k+2*e);}

const inited=new Set();function need(name){if(!inited.has(name)){S[name].init();inited.add(name);}return S[name];}

 // outside a transition the shot whose own start is latest owns the frame (pre-rolls only feed transitions)
